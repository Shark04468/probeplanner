<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrainPlanner 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: opacity 0.5s;
    }
    #loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-title {
      color: #00d4ff;
      font-family: 'SF Mono', monospace;
      font-size: 16px;
      letter-spacing: 0.15em;
      margin-bottom: 24px;
    }
    .loading-bar-wrap {
      width: 260px;
      height: 3px;
      background: #0a1a2a;
      border-radius: 2px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      background: linear-gradient(90deg, #00d4ff, #34d399);
      width: 0%;
      transition: width 0.2s;
      border-radius: 2px;
    }
    .loading-pct {
      color: #3a6888;
      font-family: monospace;
      font-size: 11px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="loading-overlay">
    <div class="loading-title">BRAIN PLANNER 3D</div>
    <div class="loading-bar-wrap">
      <div class="loading-bar" id="loading-bar"></div>
    </div>
    <div class="loading-pct" id="loading-pct">0%</div>
  </div>

  <script>
    var buildUrl = "Build";
    var canvas = document.getElementById('unity-canvas');
    var pointerDown = null;

    function emitToParent(eventName, data) {
      var payload = { source: 'BrainPlannerUnity', event: eventName, data: String(data || '') };
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        } else {
          window.postMessage(payload, '*');
        }
      } catch (e) {
        console.warn('[BrainPlanner] postMessage failed:', e);
      }
    }

    
    window.addEventListener('error', function (e) {
      emitToParent('error', String(e.message || e.error || 'window error'));
    });
    window.addEventListener('unhandledrejection', function (e) {
      emitToParent('error', String((e.reason && (e.reason.message || e.reason)) || 'unhandled rejection'));
    });
    (function () {
      var nativeAlert = window.alert;
      window.alert = function (msg) {
        emitToParent('error', String(msg || 'alert'));
        nativeAlert(msg);
      };
    })();

    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "BCILab",
      productName: "BrainPlanner",
      productVersion: "1.0",
      showBanner: function(msg, type) {
        if (type !== 'error') return;
        console.error('[Unity]', msg);
        emitToParent('error', String(msg || 'Unity runtime error'));
      }
    };

    var script = document.createElement('script');
    script.src = loaderUrl;
    script.async = true;
    script.onerror = function() {
      emitToParent('error', 'Failed to load Unity loader at ' + loaderUrl);
    };
    script.onload = function() {
      createUnityInstance(
        document.querySelector('#unity-canvas'),
        config,
        function onProgress(progress) {
          var pct = Math.round(progress * 100);
          document.getElementById('loading-bar').style.width = pct + '%';
          document.getElementById('loading-pct').textContent = pct + '%';
        }
      ).then(function(unityInstance) {
        window.unityInstance = unityInstance;

        var overlay = document.getElementById('loading-overlay');
        overlay.classList.add('hidden');
        setTimeout(function() { overlay.style.display = 'none'; }, 600);

        emitToParent('instanceReady', '');
      }).catch(function(msg) {
        var text = String(msg || 'createUnityInstance failed');
        console.error('[BrainPlanner] Unity load failed:', text);
        emitToParent('error', text);
      });
    };
    document.body.appendChild(script);

    function emitStateAck(method, stateVersion, extras) {
      var payload = {
        method: String(method || ''),
        stateVersion: Number.isFinite(Number(stateVersion)) ? Number(stateVersion) : 0,
        ts: Date.now()
      };
      if (extras && typeof extras === 'object') {
        for (var k in extras) {
          if (Object.prototype.hasOwnProperty.call(extras, k)) payload[k] = extras[k];
        }
      }
      emitToParent('stateAck', JSON.stringify(payload));
    }

    window.addEventListener('message', function(e) {
      if (!e.data || e.data.target !== 'BrainPlannerUnity') return;
      if (!window.unityInstance) return;

      var cmd = e.data;
      var method = cmd && cmd.method ? String(cmd.method) : '';
      var param = cmd && cmd.param !== undefined ? String(cmd.param) : '';
      var stateVersion = cmd && cmd.stateVersion !== undefined ? Number(cmd.stateVersion) : 0;
      if (!method) return;

      // Frontend heartbeat should never depend on Unity C# frame timing.
      if (method === 'Heartbeat') {
        emitToParent('heartbeatAck', JSON.stringify({ ts: Date.now(), stateVersion: stateVersion }));
        emitStateAck('Heartbeat', stateVersion);
        return;
      }

      // Alias for compatibility with older bridge methods.
      var dispatchMethod = method === 'SetView' ? 'SetCameraView' : method;
      try {
        window.unityInstance.SendMessage('BrainController', dispatchMethod, param);
        if (method === 'SetStateSnapshot') {
          emitToParent('snapshotApplied', JSON.stringify({ stateVersion: stateVersion }));
        }
        emitStateAck(method, stateVersion, dispatchMethod !== method ? { dispatchedAs: dispatchMethod } : null);
      } catch (err) {
        emitToParent('error', 'SendMessage failed for ' + method + ': ' + String((err && err.message) || err || 'unknown'));
      }
    });

    function onResize() {
      if (canvas) {
        canvas.width = window.innerWidth * window.devicePixelRatio;
        canvas.height = window.innerHeight * window.devicePixelRatio;
      }
    }

    canvas.addEventListener('pointerdown', function (e) {
      pointerDown = {
        x: e.clientX,
        y: e.clientY,
        ts: performance.now(),
      };
    });

    canvas.addEventListener('pointerup', function (e) {
      if (!window.unityInstance) return;
      if (!pointerDown) return;

      var dist = Math.hypot(e.clientX - pointerDown.x, e.clientY - pointerDown.y);
      var dt = performance.now() - pointerDown.ts;
      var isClick = dist <= 6 && dt <= 500;
      pointerDown = null;
      if (!isClick) return;

      var rect = canvas.getBoundingClientRect();
      var payload = {
        type: 'click',
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
        width: rect.width,
        height: rect.height
      };
      window.unityInstance.SendMessage('BrainController', 'OnCanvasPointer', JSON.stringify(payload));
    });

    window.addEventListener('resize', onResize);
    onResize();
  </script>
</body>
</html>
