[package]
name = "planner-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "planner_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
axum = "0.7"
memmap2 = "0.9"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
approx = "0.5"
