name: paper-macos-intel
on:
  push:
    branches: [evidence/paper-macos-intel-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-software-intel:
    runs-on: macos-15-intel
    timeout-minutes: 180
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 56868d57c23cbbb1207666f5e420bf47019591c6
          path: frozen
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        env:
          UV_PYTHON_PREFERENCE: only-managed
        with:
          version: "0.13.6"
          python-version: "3.10.20"
          activate-environment: true
          venv-path: ${{ runner.temp }}/probeplanner-python
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.14.0"
      - name: Verify external packaging applicability policy
        run: python -m unittest discover -s harness/scripts/qualification -p 'test_portable_checks.py' -v
      - name: Run unchanged paper tests and scientific checks
        run: >-
          python harness/scripts/qualification/qualify_triplatform.py
          --source frozen --output "${{ runner.temp }}/paper-platform-evidence"
          --data "${{ runner.temp }}/paper-platform-data"
      - name: Preserve evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: paper-platform-macos-15-intel
          path: ${{ runner.temp }}/paper-platform-evidence
          retention-days: 30
          if-no-files-found: error
          include-hidden-files: true
