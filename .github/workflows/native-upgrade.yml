name: native-upgrade

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_native_gates:
        description: "Run artifact-backed native backend and SDF gates on a self-hosted Windows runner"
        type: boolean
        default: false
      run_3d_gate:
        description: "Run headed 3D WebGL gate on a self-hosted Windows runner with GPU/browser support"
        type: boolean
        default: false

jobs:
  static-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ui:build
      - run: cargo test -p planner-engine
      - name: Install backend compatibility test dependencies
        run: python -m pip install -r apps/backend-compat/requirements.txt
      - run: npm run backend:test
      - name: Python compileall for backend scripts
        run: python -m compileall apps/backend-compat/scripts
      - name: PowerShell parser check
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Path scripts, apps/backend-compat/scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $messages = $parseErrors | ForEach-Object { $_.Message }
              $errors += "$($_.FullName): $($messages -join '; ')"
            }
          }
          if ($errors.Count -gt 0) { throw ($errors -join "`n") }

  native-backend-gates:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_native_gates)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    env:
      PROBEPLANNER_ARTIFACT_ROOT: ${{ vars.PROBEPLANNER_ARTIFACT_ROOT }}
      PERF_BASELINE_SUMMARY: ${{ vars.PERF_BASELINE_SUMMARY || 'reports/baseline-legacy-10/summary.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Require artifact root
        shell: pwsh
        run: |
          if (-not $env:PROBEPLANNER_ARTIFACT_ROOT) { throw "Set repository variable PROBEPLANNER_ARTIFACT_ROOT for self-hosted gate runners." }
          if (-not (Test-Path $env:PROBEPLANNER_ARTIFACT_ROOT)) { throw "Artifact root not found: $env:PROBEPLANNER_ARTIFACT_ROOT" }
          if (-not (Test-Path $env:PERF_BASELINE_SUMMARY)) { throw "Backend baseline summary not found: $env:PERF_BASELINE_SUMMARY" }
      - name: Start native engine
        shell: pwsh
        run: |
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_engine.ps1",
            "-ArtifactRoot", $env:PROBEPLANNER_ARTIFACT_ROOT, "-KillExisting"
          )
          ./scripts/wait_http.ps1 -Url "http://127.0.0.1:7878/healthz" -TimeoutSeconds 180
      - name: Start backend compatibility shell
        shell: pwsh
        run: |
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "apps/backend-compat/scripts/start_backend_compat.ps1",
            "-ArtifactRoot", $env:PROBEPLANNER_ARTIFACT_ROOT, "-UseEngineService"
          )
          ./scripts/wait_http.ps1 -Url "http://127.0.0.1:5000/api/status" -TimeoutSeconds 240
      - name: Run 10-case backend gate
        run: npm run perf:gate:backend -- --baseline "$env:PERF_BASELINE_SUMMARY" --out reports/ci-native-backend --case-group replay10 --case-limit 10 --runs 3
        shell: pwsh
      - name: Run SDF adversarial gate
        run: npm run perf:gate:sdf -- --baseline "$env:PERF_BASELINE_SUMMARY" --out reports/ci-sdf-adversarial --runs 1
        shell: pwsh
      - name: Run MRI registration QC gate
        run: npm run mri:qc
        shell: pwsh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-backend-gate-reports
          path: reports/ci-*
      - name: Stop local services
        if: always()
        shell: pwsh
        run: ./scripts/stop_local_stack.ps1 -Ports 7878,5000

  browser3d-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_3d_gate)
    runs-on: [self-hosted, Windows]
    timeout-minutes: 90
    env:
      PROBEPLANNER_ARTIFACT_ROOT: ${{ vars.PROBEPLANNER_ARTIFACT_ROOT }}
      BROWSER3D_BASELINE_SUMMARY: ${{ vars.BROWSER3D_BASELINE_SUMMARY || 'reports/browser3d-profile-current-dpr1-v3/summary.json' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm --prefix apps/ui ci
      - run: npm run ui:build
      - name: Start app stack
        shell: pwsh
        run: |
          if (-not $env:PROBEPLANNER_ARTIFACT_ROOT) { throw "Set repository variable PROBEPLANNER_ARTIFACT_ROOT for self-hosted gate runners." }
          if (-not (Test-Path $env:PROBEPLANNER_ARTIFACT_ROOT)) { throw "Artifact root not found: $env:PROBEPLANNER_ARTIFACT_ROOT" }
          if (-not (Test-Path $env:BROWSER3D_BASELINE_SUMMARY)) { throw "3D baseline summary not found: $env:BROWSER3D_BASELINE_SUMMARY" }
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/run_engine.ps1",
            "-ArtifactRoot", $env:PROBEPLANNER_ARTIFACT_ROOT, "-KillExisting"
          )
          ./scripts/wait_http.ps1 -Url "http://127.0.0.1:7878/healthz" -TimeoutSeconds 180
          Start-Process -FilePath powershell -WindowStyle Hidden -ArgumentList @(
            "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "apps/backend-compat/scripts/start_backend_compat.ps1",
            "-ArtifactRoot", $env:PROBEPLANNER_ARTIFACT_ROOT, "-UseEngineService"
          )
          ./scripts/wait_http.ps1 -Url "http://127.0.0.1:5000/api/status" -TimeoutSeconds 240
          ./scripts/stop_local_stack.ps1 -Ports 3100
          Start-Process -FilePath python -WindowStyle Hidden -ArgumentList @("-m", "http.server", "3100", "--directory", "apps/ui/build")
          ./scripts/wait_http.ps1 -Url "http://127.0.0.1:3100" -TimeoutSeconds 120
      - name: Run headed 3D gate
        shell: pwsh
        run: npm run perf:gate:3d -- --baseline "$env:BROWSER3D_BASELINE_SUMMARY" --out reports/ci-browser3d --frontend-url http://127.0.0.1:3100 --backend-url http://127.0.0.1:5000 --runs 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser3d-gate-reports
          path: reports/ci-browser3d
      - name: Stop local services
        if: always()
        shell: pwsh
        run: ./scripts/stop_local_stack.ps1 -Ports 7878,5000,3100
