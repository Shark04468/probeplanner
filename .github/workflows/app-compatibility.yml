name: App compatibility

on:
  push:
    branches: ['release/v*']
  pull_request:
    paths:
      - 'apps/backend-compat/**'
      - 'apps/ui/**'
      - 'package*.json'
      - '.github/workflows/app-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-regression:
    name: Build and regress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      ITK_GLOBAL_DEFAULT_NUMBER_OF_THREADS: '1'
      PYTHONUTF8: '1'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/backend-compat/requirements-registration.txt
      - name: Install maintained backend
        run: python -m pip install -r apps/backend-compat/requirements-registration.txt
      - name: Install UI and build
        run: npm run app:build
      - name: Check supported entrypoint
        run: npm run app:start -- --help
      - name: Frontend regression
        run: npm --prefix apps/ui run quality
      - name: Backend and bound-session regression
        run: python -m pytest -q apps/backend-compat/tests --junitxml=backend-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-regression-${{ matrix.os }}
          path: backend-tests.xml
